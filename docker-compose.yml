version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gridpulse-db
    environment:
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: gridpulse_dev
      POSTGRES_DB: gridpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
