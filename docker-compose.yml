version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: gridpulse-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init container that bootstraps the replica set
  mongo-init:
    image: mongo:7
    container_name: gridpulse-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --eval '
        try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }
        catch(e) { if (e.codeName === "AlreadyInitialized") print("Replica set already initialized"); else throw e; }
      '

volumes:
  mongodata:
    driver: local
