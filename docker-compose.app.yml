version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: gridpulse-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    container_name: gridpulse-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --eval '
        try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }); }
        catch(e) { if (e.codeName === "AlreadyInitialized") print("Replica set already initialized"); else throw e; }
      '

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: gridpulse-server
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MONGO_URL=mongodb://mongo:27017/gridpulse?replicaSet=rs0
      - SERVER_PORT=3001
      - CORS_ORIGIN=*
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gridpulse-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3001
    depends_on:
      - server

volumes:
  mongodata:
    driver: local
