services:
  # ==============================================================
  # 1. GridPulse Backend API & Socket.io WebSocket Service
  # ==============================================================
  - type: web
    name: gridpulse-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@9.1.0 && pnpm install && pnpm --filter @gridpulse/shared build && pnpm --filter @gridpulse/server build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: NODE_ENV
        value: production
      - key: SIMULATION_TICK_MS
        value: '3000'
      - key: SIMULATION_SPEED
        value: '1'
      - key: WEATHER_LATITUDE
        value: '18.52'
      - key: WEATHER_LONGITUDE
        value: '73.85'

  # ==============================================================
  # 2. GridPulse Next.js Web Dashboard
  # ==============================================================
  - type: web
    name: gridpulse-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@9.1.0 && pnpm install && pnpm --filter @gridpulse/shared build && pnpm --filter @gridpulse/web build
    startCommand: npx pnpm --filter @gridpulse/web start
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NEXT_PUBLIC_SERVER_URL
        sync: false
      - key: NODE_ENV
        value: production
